plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yolodetect'
    compileSdk 34

    defaultConfig {
        applicationId "com.yolodetect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Nothing Phone 2a (and virtually all modern Android phones) are ARM64.
        // Dropping x86/x86_64/armeabi-v7a cuts ~48 MB from the ORT native library.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Keep the ONNX model out of compression so it loads as a raw byte stream
    aaptOptions {
        noCompress "onnx"
    }
}

dependencies {
    def camerax = "1.3.1"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
